<text x="350" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="800" fill="#fff">MY-FITNESS</text>
<text x="350" y="730" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#b982ff">BUILD YOUR BEST SELF</text>
