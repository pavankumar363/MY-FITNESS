 <path d="M235 252 Q175 235 143 286 Q119 334 145 374 Q166 399 193 374 L239 315Z" fill="url(#skin2)"/>
 <ellipse cx="154" cy="348" rx="34" ry="48" fill="url(#skin)"/>
