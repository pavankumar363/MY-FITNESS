 <path d="M365 616 Q400 600 423 605 L456 650 L446 740 Q408 770 374 742Z" fill="url(#skin2)"/>
 <!-- dumbbells -->
 <g fill="#0a0b12" stroke="#6f4ba5" stroke-width="5">
