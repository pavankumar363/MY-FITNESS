<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 760" role="img" aria-label="MY-FITNESS bodybuilder">
<defs>
 <radialGradient id="bg" cx="50%" cy="45%" r="65%"><stop offset="0" stop-color="#34205d"/><stop offset=".55" stop-color="#110c20"/><stop offset="1" stop-color="#05060d"/></radialGradient>
 <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4c08e"/><stop offset=".45" stop-color="#b96f48"/><stop offset="1" stop-color="#6b342c"/></linearGradient>
 <linearGradient id="skin2" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffd09d"/><stop offset=".5" stop-color="#c77b50"/><stop offset="1" stop-color="#7b3d31"/></linearGradient>
 <linearGradient id="shorts" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#202236"/><stop offset="1" stop-color="#05060d"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="15" flood-opacity=".5"/></filter>
</defs>
<rect width="700" height="760" rx="36" fill="url(#bg)"/>
