<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Choose Your Goals | MY-FITNESS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="goals-page">

    <div class="goals-wrapper">

        <!-- HEADER -->
        <header class="setup-header">

            <a href="index.html" class="auth-logo">
                <span class="logo-icon">MF</span>
                <span>MY-FITNESS</span>
            </a>

            <div class="setup-progress">

                <span class="progress-completed">✓</span>

                <span class="progress-line completed-line"></span>

                <span class="progress-active">2</span>

                <span class="progress-line"></span>

                <span>3</span>

            </div>

        </header>


        <!-- MAIN CARD -->
        <main class="goals-card">

            <div class="setup-title">

                <span class="setup-label">
                    STEP 2 OF 3
                </span>

                <h1>Choose Your Fitness Goals</h1>

                <p>
                    Select the goals you want to focus on.
                    You can choose more than one.
                </p>

            </div>


            <!-- GOALS -->
            <section class="goals-section">

                <div class="goal-grid">

                    <!-- STRENGTH -->
                    <label class="goal-option">

                        <input
                            type="checkbox"
                            name="fitnessGoal"
                            value="strength"
                        >

                        <div class="goal-card">

                            <div class="goal-icon">
                                💪
                            </div>

                            <div class="goal-content">

                                <h3>Build Strength</h3>

                                <p>
                                    Improve your strength and
                                    build a stronger body.
                                </p>

                            </div>

                            <div class="goal-check">
                                ✓
                            </div>

                        </div>

                    </label>


                    <!-- STAMINA -->
                    <label class="goal-option">

                        <input
                            type="checkbox"
                            name="fitnessGoal"
                            value="stamina"
                        >

                        <div class="goal-card">

                            <div class="goal-icon">
                                🏃
                            </div>

                            <div class="goal-content">

                                <h3>Fitness & Stamina</h3>

                                <p>
                                    Improve endurance, stamina,
                                    and overall fitness.
                                </p>

                            </div>

                            <div class="goal-check">
                                ✓
                            </div>

                        </div>

                    </label>


                    <!-- HEALTHY WEIGHT -->
                    <label class="goal-option">

                        <input
                            type="checkbox"
                            name="fitnessGoal"
                            value="healthy-weight"
                        >

                        <div class="goal-card">

                            <div class="goal-icon">
                                ⚖️
                            </div>

                            <div class="goal-content">

                                <h3>Healthy Weight</h3>

                                <p>
                                    Build healthy habits and
                                    maintain a healthy weight.
                                </p>

                            </div>

                            <div class="goal-check">
                                ✓
                            </div>

                        </div>

                    </label>


                    <!-- FLEXIBILITY -->
                    <label class="goal-option">

                        <input
                            type="checkbox"
                            name="fitnessGoal"
                            value="flexibility"
                        >

                        <div class="goal-card">

                            <div class="goal-icon">
                                🧘
                            </div>

                            <div class="goal-content">

                                <h3>Flexibility & Mobility</h3>

                                <p>
                                    Improve flexibility, mobility,
                                    balance, and movement.
                                </p>

                            </div>

                            <div class="goal-check">
                                ✓
                            </div>

                        </div>

                    </label>


                    <!-- SPORTS -->
                    <label class="goal-option">

                        <input
                            type="checkbox"
                            name="fitnessGoal"
                            value="sports"
                        >

                        <div class="goal-card">

                            <div class="goal-icon">
                                🏆
                            </div>

                            <div class="goal-content">

                                <h3>Sports Performance</h3>

                                <p>
                                    Improve your performance,
                                    speed, coordination, and fitness.
                                </p>

                            </div>

                            <div class="goal-check">
                                ✓
                            </div>

                        </div>

                    </label>

                </div>

            </section>


            <!-- MESSAGE -->
            <p id="goalsMessage" class="form-message"></p>


            <!-- ACTIONS -->
            <div class="goals-actions">

                <a
                    href="profile.html"
                    class="goal-back-btn"
                >
                    ← Back
                </a>

                <button
                    type="button"
                    id="continueGoals"
                    class="setup-submit"
                >
                    Continue to Dashboard →
                </button>

            </div>


            <div class="goals-tip">

                💡 <strong>Tip:</strong>
                Choose the goals that matter most to you.
                You can update them later from your profile.

            </div>

        </main>


        <!-- FOOTER -->
        <footer class="setup-footer">
            MY-FITNESS • Build Your Best Self
        </footer>

    </div>


    <!-- JavaScript will be connected in the final version -->

</body>
</html>
